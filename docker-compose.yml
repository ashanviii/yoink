# yoink + Caddy (automatic HTTPS via Let's Encrypt).
# Configure everything in .env (see .env.example), then: docker compose up -d --build
services:
  yoink:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    env_file: .env
    # Contain the app: no privilege escalation or extra kernel capabilities, and bounded
    # memory/processes so a runaway extraction can't take Caddy or the host down with it.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 256
    environment:
      # Fail fast at `docker compose up` instead of at the first request.
      YOINK_SECRET: ${YOINK_SECRET:?set YOINK_SECRET in .env (openssl rand -base64 48)}
      # Caddy sits in front and sets X-Forwarded-For to the real client IP.
      YOINK_TRUSTED_PROXY_HOPS: "1"
      YOINK_CLIENT_IP_HEADER: ""
    # Not published to the internet — only Caddy talks to it.
    expose:
      - "3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    depends_on:
      - yoink
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
